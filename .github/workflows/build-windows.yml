name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match package.json version v$version"
          }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build:win
      - name: Prepare release assets and SHA256 checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $names = @(
            "SlotPilot-$version-Setup-x64.exe",
            "SlotPilot-$version-Portable-x64.exe"
          )
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $checksums = foreach ($name in $names) {
            $source = Join-Path release $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing release executable: $source"
            }
            Copy-Item -LiteralPath $source -Destination release-assets
            $hash = (Get-FileHash -LiteralPath (Join-Path release-assets $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath "release-assets/SHA256SUMS-$version.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SlotPilot-Windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SlotPilot-Windows
          path: release-assets
      - name: Attach assets to the tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh release view "$env:GITHUB_REF_NAME" --json tagName
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release assets for $env:GITHUB_REF_NAME"
          }
